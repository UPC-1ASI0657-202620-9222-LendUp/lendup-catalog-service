server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: lendup-catalog-service

  # El proceso Spring Boot se ejecuta en Windows; MySQL corre en Docker.
  # En despliegue, cambiar DB_URL al host privado de la base de Catálogo.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/lendup_catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:lendup_catalogo}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

# Deshabilitada hasta configurar Firebase y un servidor Identidad que exponga
# GET /api/v1/estudiantes/me (retorna usuario.id). Sin bypass de desarrollo.
catalogo:
  security:
    firebase-enabled: ${CATALOGO_FIREBASE_ENABLED:false}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}

identity:
  base-url: ${IDENTITY_BASE_URL:}
