# Local development: preserve the original MySQL volume and Compose project name.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lendup_catalogo
      MYSQL_USER: ${DB_USERNAME:-lendup_catalogo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["dotnet"]
    build: .
    ports:
      - "127.0.0.1:${CATALOGO_HOST_PORT:-8084}:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lendup_catalogo
      DB_USERNAME: ${DB_USERNAME:-lendup_catalogo}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_ENABLED: "true"
      REDIS_CONNECTION: redis:6379,abortConnect=false,connectTimeout=500,syncTimeout=500,asyncTimeout=500
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-60}
      CATALOGO_FIREBASE_ENABLED: ${CATALOGO_FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-}
      CATALOG_RESERVATIONS_SERVICE_TOKEN: ${CATALOG_RESERVATIONS_SERVICE_TOKEN:-}
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  catalog-mysql-data:
